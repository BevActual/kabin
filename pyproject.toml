[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kabin"
version = "0.1.0"
description = "A personal media cabinet for games, books, music, movies, and more"
requires-python = ">=3.11"
authors = [{ name = "Andrew" }]

[project.scripts]
kabin = "kabin.app:main"

[tool.setuptools.packages.find]
include = ["kabin*"]
