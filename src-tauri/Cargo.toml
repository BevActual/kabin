[package]
name = "kabin"
version = "0.1.0"
description = "Kabin — personal media cabinet"
authors = ["Andrew"]
edition = "2021"

[lib]
name = "kabin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "http-range"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
regex = "1"
shell-words = "1"
zip = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.13"
sha2 = "0.10"
hex = "0.4"
subtle = "2"
rand = "0.8"
base64 = "0.22"
roxmltree = "0.20"
ureq = "2.10"
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
